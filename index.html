<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E102 Review Exam</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

body{
  margin:0;
  font-family:'Patrick Hand', cursive;
  background:#f5f5f5;
}

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  box-sizing:border-box;
}

.question-card{
  width:90%;
  max-width:750px;
  min-height:500px;
  border:5px solid #c40000;
  border-radius:18px;
  padding:35px;
  box-sizing:border-box;
  background:
    repeating-linear-gradient(
      to bottom,
      #fffdf5 0px,
      #fffdf5 34px,
      #b8d4ff 35px
    );
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  font-size:30px;
  line-height:1.5;
}

h1{
  text-align:center;
  color:#b00000;
  font-size:44px;
}

.question-number{
  color:#b00000;
  font-weight:bold;
}

.options{
  margin-top:25px;
}

label{
  display:block;
  margin:12px 0;
  cursor:pointer;
}

input{
  transform:scale(1.4);
  margin-right:12px;
}

.nav{
  margin-top:35px;
  display:flex;
  justify-content:space-between;
}

button{
  font-family:'Patrick Hand', cursive;
  font-size:24px;
  padding:8px 22px;
  border-radius:10px;
  border:2px solid #b00000;
  background:white;
  color:#b00000;
  cursor:pointer;
}

button:hover{
  background:#b00000;
  color:white;
}

.result{
  text-align:center;
  font-size:38px;
  color:#b00000;
}
</style>
</head>

<body>

<div id="exam"></div>

<script>

const questions = [

{q:"On weekends, we have __________ very early in the morning.",o:["breakfast","lunch","dinner"]},

{q:"They have __________ with their children at home after work.",o:["breakfast","lunch","dinner"]},

{q:"My family and I usually have __________ at home. Restaurants are too busy in the evening.",o:["breakfast","lunch","dinner"]},

{q:"A: What do we need for breakfast?<br>B: Let’s see. We need __________ cereal.",o:["some","any"]},

{q:"Do we have __________ eggs?",o:["some","any"]},

{q:"We have __________ apple.",o:["a","an"]},

{q:"A: I need a snack.<br>B: How about __________ crackers and cheese?",o:["some","any"]},

{q:"A: Do you usually have lunch in the cafeteria?<br>B: No, I don’t have time. I __________ have lunch there.",o:["usually","always","hardly ever"]},

{q:"I __________ pasta for dinner.",o:["sometimes eat","eat sometimes"]},

{q:"Ahmed __________ golf on weekends.",o:["plays","goes"]},

{q:"They sometimes __________ swimming in the pool.",o:["play","go"]},

{q:"A: Can you play the violin?<br>B: Yes, I __________.",o:["can","can’t"]},

{q:"A: Can they play chess?<br>B: No, they __________.",o:["can","can’t"]},

{q:"Can he __________ a cake?",o:["bake","baking"]},

{q:"Are we going to __________ this weekend?",o:["work","working"]},

{q:"__________ they going to cook dinner?",o:["Is","Are"]},

{q:"A: Are you going to exercise this evening?<br>B: Yes, I __________. I’m going to go swimming.",o:["am","’m"]},

{q:"A: I have a headache.<br>B: __________ these pills with some water.",o:["take","use"]},

{q:"A: What’s the matter?<br>B: I don’t feel well. I __________ a stomachache.",o:["have","hurt"]},

{q:"A: How do you feel today?<br>B: Not so good. My eyes are dry, and they __________.",o:["have","hurt"]},

<!-- Questions 21,22,23 Deleted -->

{q:"She __________ sick.",o:["feels","has"]},

{q:"He __________ the flu.",o:["feels","has"]},

{q:"I __________ fine.",o:["feel","have"]},

{q:"You can __________ at a coffee shop.",o:["meet your friends","go to the museum","catch a train"]}

];

let current = 0;

function showQuestion(){
  const exam = document.getElementById("exam");
  const q = questions[current];

  exam.innerHTML = `
  <div class="page">
    <div class="question-card">

      <h1>E102 Review</h1>

      <div>
        <span class="question-number">
        Question ${current + 1} / ${questions.length}
        </span>

        <br><br>

        ${q.q}
      </div>

      <div class="options">
        ${q.o.map((opt,i)=>`
          <label>
            <input type="radio" name="q${current}">
            ${opt}
          </label>
        `).join("")}
      </div>

      <div class="nav">
        <button onclick="prevQuestion()">Previous</button>

        ${
          current === questions.length - 1
          ? `<button onclick="finishExam()">Finish</button>`
          : `<button onclick="nextQuestion()">Next</button>`
        }
      </div>

    </div>
  </div>
  `;
}

function nextQuestion(){
  if(current < questions.length - 1){
    current++;
    showQuestion();
  }
}

function prevQuestion(){
  if(current > 0){
    current--;
    showQuestion();
  }
}

function finishExam(){
  document.getElementById("exam").innerHTML = `
  <div class="page">
    <div class="question-card result">
      ✅ Exam Finished
    </div>
  </div>
  `;
}

showQuestion();

</script>

</body>
</html>
